options csm_dp rx_queue_size=1024 memory_profile=2

# example for UL_DATA/UL_CTRL buf_cnt control
#
# options csm_dp rx_queue_size=1024 memory_profile=2 ul_data_buf_cnt_override=0,512,1024 ul_ctrl_buf_cnt_override=0,512,1024
#
#  UL_DATA:
#    VF1: 0, take default setting
#    VF2: take 512 as UL_DATA buf_cnt
#    VF3: take 1024 as UL_DATA buf_cnt
#    VF4: absent, take default setting
#
#  UL_CTRL:
#    VF1: 0, take default setting
#    VF2: take 512 as UL_CTRL buf_cnt
#    VF3: take 1024 as UL_CTRL buf_cnt
#    VF4: absent, take default setting
